<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Web | Chat Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #0b1220;
      --accent: linear-gradient(90deg, #7c3aed, #06b6d4);
      --radius: 16px;
      color-scheme: dark;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #fff;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .chat-box {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      animation: fadeIn 1s ease forwards;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin-bottom: 16px;
      font-weight: 800;
      background: var(--accent);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    .btn {
      margin-top: 24px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .spark {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle at center, rgba(124, 58, 237, 0.25), transparent 70%);
      filter: blur(80px);
      z-index: -1;
      animation: pulse 6s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.3); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="spark"></div>
  <div class="chat-box">
    <h1>Hello, Web 👋</h1>
    <p>Welcome to your stylish single-page starter — a clean, chat-style intro with glass effect, smooth gradients, and a fade-in animation. Perfect for landing screens or greetings!</p>
    <button class="btn" onclick="alert('Welcome aboard! 🎉')">Let's Go</button>
  </div>
</body>
